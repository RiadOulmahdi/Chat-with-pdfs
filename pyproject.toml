[project]
name = "chat-with-pdfs"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.141.1",
    "langchain>=1.3.17",
    "langchain-chroma>=1.1.0",
    "langchain-openai>=1.6.0",
    "langchain-text-splitters>=1.1.2",
    "pydantic-settings>=2.15.0",
    "pypdf[crypto]>=6.16.2",
    "python-dotenv>=1.2.3",
    "streamlit>=1.63.0",
    "tenacity>=9.1.4",
    "tiktoken>=0.14.0",
    "uvicorn>=0.52.4",
]

[project.scripts]
ingest = "importer.load_and_process:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "importer"]
